<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="../static/style.css">
    <meta charset="UTF-8">
    <title>Customer Churn Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="top-wave"></div>

    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>
    <div class="circle circle4"></div>

    <div class="bottom-wave"></div>


    <div class="container mt-5">
        <h1 class="text-center">Customer Churn Prediction</h1>

        <form method="POST" class="mt-4">
            <div class="row">

                <div class="col-md-6">
                    <!-- Gender -->
                    <div class="mb-3">
                        <label class="form-label">Gender</label>
                        <select name="gender" class="form-select">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>

                    <!-- Senior Citizen -->
                    <div class="mb-3">
                        <label class="form-label">Senior Citizen</label>
                        <select name="SeniorCitizen" class="form-select">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <!-- Partner -->
                    <div class="mb-3">
                        <label class="form-label">Partner</label>
                        <select name="Partner" class="form-select">
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>

                    <!-- Dependents -->
                    <div class="mb-3">
                        <label class="form-label">Dependents</label>
                        <select name="Dependents" class="form-select">
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>

                    <!-- Tenure -->
                    <div class="mb-3">
                        <label class="form-label">Tenure</label>
                        <input type="number" name="tenure" class="form-control" required>
                    </div>
                </div>

                <div class="col-md-6">

                    <!-- Internet Service -->
                    <div class="mb-3">
                        <label class="form-label">Internet Service</label>
                        <select name="InternetService" class="form-select">
                            <option value="DSL">DSL</option>
                            <option value="Fiber optic">Fiber optic</option>
                            <option value="No">No</option>
                        </select>
                    </div>

                    <!-- Contract -->
                    <div class="mb-3">
                        <label class="form-label">Contract</label>
                        <select name="Contract" class="form-select">
                            <option value="Month-to-month">Month-to-month</option>
                            <option value="One year">One year</option>
                            <option value="Two year">Two year</option>
                        </select>
                    </div>

                    <!-- Payment Method -->
                    <div class="mb-3">
                        <label class="form-label">Payment Method</label>
                        <select name="PaymentMethod" class="form-select">
                            <option value="Electronic check">Electronic check</option>
                            <option value="Mailed check">Mailed check</option>
                            <option value="Bank transfer (automatic)">Bank transfer (automatic)</option>
                            <option value="Credit card (automatic)">Credit card (automatic)</option>
                        </select>
                    </div>

                    <!-- Monthly Charges -->
                    <div class="mb-3">
                        <label class="form-label">Monthly Charges</label>
                        <input type="number" step="0.01" name="MonthlyCharges" class="form-control" required>
                    </div>

                    <!-- Total Charges -->
                    <div class="mb-3">
                        <label class="form-label">Total Charges</label>
                        <input type="number" step="0.01" name="TotalCharges" class="form-control" required>
                    </div>

                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Predict</button>
        </form>

        <!-- {% if prediction %}
        <div class="mt-4 text-center">
            <h3>Prediction: {{ prediction }}</h3>
            <p>Probability: {{ probability }}</p>
        </div>
        {% endif %} -->
    </div>
</body>

</html>
